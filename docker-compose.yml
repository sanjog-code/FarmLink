version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: farmlink-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: farmlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmlink-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/farmlink?schema=public
      JWT_SECRET: ${JWT_SECRET:-farmlink-jwt-dev-secret-2026}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-farmlink-dev-secret-key-2026}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm run start"

volumes:
  postgres_data:
